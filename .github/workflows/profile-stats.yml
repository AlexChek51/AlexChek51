name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/build-profile.mjs
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Build images from public GitHub data
        run: node scripts/build-profile.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save refreshed images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/header-dark.svg assets/header-light.svg assets/stats-dark.svg assets/stats-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public profile statistics'
            git push
          fi
