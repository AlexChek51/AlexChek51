<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc"><title id="title">Проекты в цифрах: 6 языков LANDAX, видео 6–180 секунд, 3 Mini Apps, 142 услуги ZONT</title><desc id="desc"></desc><defs>
  <linearGradient id="electric" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4388FF"/><stop offset=".6" stop-color="#48DFFF"/><stop offset="1" stop-color="#D0FF71"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#1665EA" stop-opacity=".42"/><stop offset="1" stop-color="#1665EA" stop-opacity="0"/></radialGradient>
  <linearGradient id="rim"><stop stop-color="#48DFFF"/><stop offset=".56" stop-color="#4B85FF"/><stop offset="1" stop-color="#D0FF71"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><style>
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
  .orbit{transform-origin:960px 234px;animation:orbit 24s linear infinite}
  .reverse{animation-direction:reverse;animation-duration:34s}
  .breathe{animation:breathe 4s ease-in-out infinite}
  .intro{animation:appear 700ms cubic-bezier(.23,1,.32,1) both}
  @media(prefers-reduced-motion:reduce){.orbit,.breathe,.intro{animation:none}.moving{display:none}}
</style><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="286" height="148" rx="14" fill="#101C32" stroke="#243A57" /><rect x="18" y="20" width="4" height="40" rx="2" fill="#48DFFF" stroke="none" /><text x="36" y="61" font-size="42" fill="#48DFFF" font-weight="700" letter-spacing="-1">6</text><text x="20" y="95" font-size="17" fill="#F4F8FF" >языков интерфейса</text><text x="20" y="124" font-size="12" fill="#9DB1CE" letter-spacing=".5">LANDAX.AI</text><rect x="305" y="1" width="286" height="148" rx="14" fill="#101C32" stroke="#243A57" /><rect x="322" y="20" width="4" height="40" rx="2" fill="#548BFF" stroke="none" /><text x="340" y="61" font-size="42" fill="#548BFF" font-weight="700" letter-spacing="-1">6–180</text><text x="324" y="95" font-size="17" fill="#F4F8FF" >секунд в AI-ролике</text><text x="324" y="124" font-size="12" fill="#9DB1CE" letter-spacing=".5">AVATARAI</text><rect x="609" y="1" width="286" height="148" rx="14" fill="#101C32" stroke="#243A57" /><rect x="626" y="20" width="4" height="40" rx="2" fill="#D0FF71" stroke="none" /><text x="644" y="61" font-size="42" fill="#D0FF71" font-weight="700" letter-spacing="-1">3</text><text x="628" y="95" font-size="17" fill="#F4F8FF" >Telegram Mini Apps</text><text x="628" y="124" font-size="10" fill="#9DB1CE" letter-spacing=".5">CLIPARIUM / KAIRO / CHANNELOOM</text><rect x="913" y="1" width="286" height="148" rx="14" fill="#101C32" stroke="#243A57" /><rect x="930" y="20" width="4" height="40" rx="2" fill="#FFAE83" stroke="none" /><text x="948" y="61" font-size="42" fill="#FFAE83" font-weight="700" letter-spacing="-1">142</text><text x="932" y="95" font-size="17" fill="#F4F8FF" >услуги в каталоге</text><text x="932" y="124" font-size="12" fill="#9DB1CE" letter-spacing=".5">ZONT × YCLIENTS</text></g></svg>
