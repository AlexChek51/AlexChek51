<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">GitHub: 26 репозиториев, 10 вкладов за 12 месяцев; распределение языков</title><desc id="desc"></desc><defs>
